
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Division Quiz</title>
  <style>
    :root {
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef6ff, #dbeafe);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      width: min(94vw, 520px);
      padding: 24px;
      text-align: center;
    }

    h1, h2 { margin-top: 0; color: #1d4ed8; }

    .screen { display: block; }
    .hidden { display: none; }

    .input {
      width: 100%;
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      margin: 8px 0 12px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 8px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #334155;
      font-weight: bold;
    }

    .toggle-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .toggle-btn {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      color: #0f172a;
    }

    .toggle-btn.active {
      background: #dbeafe;
      border-color: #2563eb;
      color: #1d4ed8;
      font-weight: bold;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    button:hover { transform: translateY(-2px); }

    .primary-btn { background: #2563eb; color: white; }
    .primary-btn:hover { background: #1d4ed8; }

    .secondary-btn { background: #e2e8f0; color: #0f172a; }
    .secondary-btn:hover { background: #cbd5e1; }

    .difficulty-btn {
      min-width: 100px;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      color: #0f172a;
    }

    .difficulty-btn.active {
      background: #dbeafe;
      border-color: #2563eb;
      color: #1d4ed8;
      font-weight: bold;
    }

    .welcome { margin: 10px 0 20px; color: #334155; }

    .stats {
      display: flex;
      justify-content: space-between;
      margin: 10px 0 16px;
      font-weight: bold;
      color: #334155;
    }

    #question {
      font-size: 1.3rem;
      margin: 12px 0 18px;
      color: #0f172a;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option-btn {
      background: #e2e8f0;
      color: #0f172a;
    }

    .option-btn:hover { background: #cbd5e1; }

    .feedback {
      margin-top: 16px;
      font-weight: bold;
      min-height: 24px;
    }

    .status-message {
      min-height: 24px;
      margin-top: 10px;
      font-weight: 700;
    }
    .status-success { color: #15803d; }
    .status-error { color: #dc2626; }

    .practice-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #fffbeb;
      border: 1px solid #f5e1a4;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      color: #92400e;
      font-weight: 600;
    }
    /* Confirmation modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-box {
      background: #0b1220;
      color: #fff;
      padding: 20px;
      border-radius: 12px;
      width: min(92vw, 420px);
      box-shadow: 0 10px 40px rgba(2,6,23,0.6);
      text-align: center;
      border: 3px solid #2b3a4b;
    }
    .modal-title { font-size: 1.25rem; color: #ffd54f; margin-bottom: 8px; }
    .modal-message { color: #e6eef8; margin-bottom: 16px; }
    .modal-actions { display:flex; gap:12px; justify-content:center; }
    .modal-yes { background: #4ade80; color: #072b05; padding: 12px 20px; border-radius:8px; border:none; }
    .modal-cancel { background: #ef4444; color: #2b0a09; padding: 12px 20px; border-radius:8px; border:none; }
    .correct { color: #15803d; }
    .wrong { color: #dc2626; }

    @media (max-width: 480px) {
      .options { grid-template-columns: 1fr; }
      .btn-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="login-screen" class="screen">
      <h1>Division Quiz</h1>
      <div class="toggle-row">
        <button id="show-login-btn" class="toggle-btn active">Login</button>
        <button id="show-signup-btn" class="toggle-btn">Sign Up</button>
      </div>
      <p id="auth-message">Log in to continue your division practice.</p>
      <div class="form-group hidden" id="name-group">
        <label for="name">Full Name</label>
        <input id="name" class="input" type="text" placeholder="Enter your full name" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" class="input" type="email" placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" class="input" type="password" placeholder="Enter your password" />
      </div>
      <button id="auth-btn" class="primary-btn">Login</button>
    </div>

    <div id="home-screen" class="screen hidden">
      <h2>Welcome</h2>
      <p id="welcome-message" class="welcome">Choose your difficulty and begin.</p>
      <div id="site-message" class="status-message hidden"></div>
      <div class="btn-row">
        <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
        <button class="difficulty-btn" data-difficulty="medium">Medium</button>
        <button class="difficulty-btn" data-difficulty="hard">Hard</button>
      </div>
      <div id="profile-area" class="welcome" style="text-align:left;">
        <p><strong>Name:</strong> <span id="profile-name">-</span></p>
        <p><strong>Email:</strong> <span id="profile-email">-</span></p>
        <button id="edit-profile-btn" class="secondary-btn">Edit Profile</button>
      </div>
      <div id="profile-edit-area" class="hidden" style="text-align:left;">
        <div class="form-group">
          <label for="profile-name-input">Full Name</label>
          <input id="profile-name-input" class="input" type="text" />
        </div>
        <div class="form-group">
          <label for="profile-email-input">Email</label>
          <input id="profile-email-input" class="input" type="email" />
        </div>
        <div class="form-group">
          <label for="profile-password-input">Password</label>
          <input id="profile-password-input" class="input" type="password" placeholder="Enter new password" />
        </div>
        <div class="btn-row">
          <button id="save-profile-btn" class="primary-btn">Save</button>
          <button id="cancel-profile-btn" class="secondary-btn">Cancel</button>
        </div>
      </div>
      <div class="btn-row">
        <button id="start-btn" class="primary-btn">Practice</button>
      </div>
      <div class="btn-row" style="margin-top:12px;">
        <button id="leaderboard-btn" class="secondary-btn">Leaderboard</button>
        <button id="export-btn" class="secondary-btn">Export Data</button>
        <label class="secondary-btn" style="cursor:pointer;">
          Import Data
          <input id="import-file" type="file" accept="application/json" style="display:none" />
        </label>
      </div>
    </div>

    <div id="quiz-screen" class="screen hidden">
      <div id="practice-banner" class="practice-banner hidden" role="status">
        <div>Practice in progress</div>
        <div style="display:flex; gap:8px;">
          <button id="end-practice-top" class="secondary-btn">End Practice</button>
        </div>
      </div>
      <h2>Division Quiz</h2>
      <div class="stats">
        <span id="question-counter">Question 1/10</span>
        <span id="score">Score: 0</span>
      </div>
      <div id="question">Loading...</div>
      <div class="options" id="options"></div>
      <div id="feedback" class="feedback"></div>
      <div class="btn-row">
        <button id="next-btn" class="primary-btn hidden">Next Question</button>
        <button id="end-practice-btn" class="secondary-btn hidden">End Practice</button>
        <button id="home-btn" class="secondary-btn hidden">Back to Home</button>
      </div>
    </div>
  </div>

  <!-- Leaderboard modal -->
  <div id="leaderboard-modal" class="hidden" aria-hidden="true">
    <div class="modal-overlay">
      <div class="modal-box" role="dialog" aria-modal="true">
        <div class="modal-title">Leaderboard</div>
        <div style="max-height:50vh; overflow:auto; margin:12px 0; background:#071429; padding:8px; border-radius:8px;">
          <table id="leaderboard-table" style="width:100%; border-collapse:collapse; color:#e6eef8;">
            <thead>
              <tr>
                <th style="text-align:left; padding:6px;">Name</th>
                <th style="text-align:left; padding:6px;">Score</th>
                <th style="text-align:left; padding:6px;">Difficulty</th>
                <th style="text-align:left; padding:6px;">Date</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="modal-actions">
          <button id="close-leaderboard" class="modal-yes">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirmation modal -->
  <div id="confirm-modal" class="hidden" aria-hidden="true">
    <div class="modal-overlay">
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div id="modal-title" class="modal-title">End Practice</div>
        <div id="modal-message" class="modal-message">Are you sure you want to end your practice session?</div>
        <div class="modal-actions">
          <button id="confirm-yes" class="modal-yes">Yes</button>
          <button id="confirm-cancel" class="modal-cancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    console.log('division-quiz script starting');
    window.addEventListener('error', (e) => {
      console.error('Runtime error', e.error || e.message);
      try { alert('Script error: ' + (e.message || e.error && e.error.message)); } catch (_) {}
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error('Unhandled rejection', e.reason);
      try { alert('Unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); } catch (_) {}
    });
    const loginScreen = document.getElementById('login-screen');
    const homeScreen = document.getElementById('home-screen');
    const quizScreen = document.getElementById('quiz-screen');

    const nameInput = document.getElementById('name');
    const nameGroup = document.getElementById('name-group');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const authBtn = document.getElementById('auth-btn');
    const authMessage = document.getElementById('auth-message');
    const showLoginBtn = document.getElementById('show-login-btn');
    const showSignupBtn = document.getElementById('show-signup-btn');
    const welcomeMessage = document.getElementById('welcome-message');
    const profileNameText = document.getElementById('profile-name');
    const profileEmailText = document.getElementById('profile-email');
    const editProfileBtn = document.getElementById('edit-profile-btn');
    const profileEditArea = document.getElementById('profile-edit-area');
    const profileNameInput = document.getElementById('profile-name-input');
    const profileEmailInput = document.getElementById('profile-email-input');
    const profilePasswordInput = document.getElementById('profile-password-input');
    const saveProfileBtn = document.getElementById('save-profile-btn');
    const cancelProfileBtn = document.getElementById('cancel-profile-btn');
    const startBtn = document.getElementById('start-btn');
    const difficultyButtons = document.querySelectorAll('.difficulty-btn');

    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const feedbackEl = document.getElementById('feedback');
    const questionCounterEl = document.getElementById('question-counter');
    const scoreEl = document.getElementById('score');
    const nextBtn = document.getElementById('next-btn');
    const endPracticeBtn = document.getElementById('end-practice-btn');
    const endPracticeTopBtn = document.getElementById('end-practice-top');
    const practiceBanner = document.getElementById('practice-banner');
    const homeBtn = document.getElementById('home-btn');
    const siteMessageEl = document.getElementById('site-message');

    let playerName = '';
    let selectedDifficulty = 'easy';
    let authMode = 'login';
    let currentQuestion = 0;
    let score = 0;
    let currentAnswer = 0;
    let totalQuestions = 10;
    let questions = [];
    let account = null;
    let isPracticing = false;

    const difficultySettings = {
      easy: { label: 'Easy', maxDivisor: 5, maxQuotient: 10, totalQuestions: 10 },
      medium: { label: 'Medium', maxDivisor: 8, maxQuotient: 15, totalQuestions: 12 },
      hard: { label: 'Hard', maxDivisor: 12, maxQuotient: 20, totalQuestions: 15 }
    };

    function showScreen(screen) {
      loginScreen.classList.add('hidden');
      homeScreen.classList.add('hidden');
      quizScreen.classList.add('hidden');
      screen.classList.remove('hidden');
    }

    function updateAuthMode(mode) {
      authMode = mode;
      showLoginBtn.classList.toggle('active', authMode === 'login');
      showSignupBtn.classList.toggle('active', authMode === 'signup');
      authBtn.textContent = authMode === 'login' ? 'Login' : 'Sign Up';
      authMessage.textContent = authMode === 'login'
        ? 'Log in to continue your division practice.'
        : 'Create an account with your name, email, and password.';
      nameGroup.classList.toggle('hidden', authMode !== 'signup');
    }

    function updateDifficultyButtons() {
      difficultyButtons.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.difficulty === selectedDifficulty);
      });
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestion() {
      const config = difficultySettings[selectedDifficulty];
      const divisor = randomInt(2, config.maxDivisor);
      const maxQuotient = Math.min(config.maxQuotient, Math.floor(120 / divisor));
      const quotient = randomInt(2, maxQuotient);
      const dividend = divisor * quotient;
      return { dividend, divisor, answer: quotient };
    }

    function buildQuestions() {
      const config = difficultySettings[selectedDifficulty];
      totalQuestions = config.totalQuestions;
      questions = [];
      for (let i = 0; i < totalQuestions; i += 1) {
        questions.push(generateQuestion());
      }
    }

    function showQuestion() {
      if (!isPracticing) {
        isPracticing = true;
        // show persistent end-practice controls
        endPracticeBtn.classList.remove('hidden');
        endPracticeTopBtn.classList.remove('hidden');
        practiceBanner.classList.remove('hidden');
      }

      if (currentQuestion >= totalQuestions) {
        finishQuiz();
        return;
      }

      const q = questions[currentQuestion];
      currentAnswer = q.answer;
      questionEl.textContent = `${q.dividend} ÷ ${q.divisor} = ?`;
      questionCounterEl.textContent = `Question ${currentQuestion + 1}/${totalQuestions}`;
      scoreEl.textContent = `Score: ${score}`;
      feedbackEl.textContent = '';
      feedbackEl.className = 'feedback';
      nextBtn.classList.add('hidden');
      homeBtn.classList.add('hidden');

      const answers = new Set([q.answer]);
      while (answers.size < 4) {
        const distractor = q.answer + randomInt(-4, 4);
        if (distractor > 0) {
          answers.add(distractor);
        }
      }

      const options = Array.from(answers);
      options.sort(() => Math.random() - 0.5);

      optionsEl.innerHTML = '';
      options.forEach((value) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = value;
        btn.addEventListener('click', () => checkAnswer(value));
        optionsEl.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn) => {
        btn.disabled = true;
      });

      if (selected === currentAnswer) {
        score += 1;
        feedbackEl.textContent = 'Correct!';
        feedbackEl.classList.add('correct');
      } else {
        feedbackEl.textContent = `Not quite. The correct answer is ${currentAnswer}.`;
        feedbackEl.classList.add('wrong');
      }

      currentQuestion += 1;
      nextBtn.classList.remove('hidden');
      endPracticeBtn.classList.remove('hidden');
    }

    function finishQuiz() {
      questionEl.textContent = `Quiz complete! ${playerName || 'Player'} scored ${score} out of ${totalQuestions}.`;
      optionsEl.innerHTML = '';
      questionCounterEl.textContent = 'Finished';
      scoreEl.textContent = `Score: ${score}`;
      feedbackEl.textContent = 'Great effort!';
      feedbackEl.className = 'feedback correct';
      nextBtn.classList.add('hidden');
      endPracticeBtn.classList.add('hidden');
      endPracticeTopBtn.classList.add('hidden');
      practiceBanner.classList.add('hidden');
      homeBtn.classList.remove('hidden');
      // save to leaderboard
      try { addToLeaderboard(playerName || 'Player', score, selectedDifficulty); } catch (e) { console.warn('Failed to add to leaderboard', e); }
      isPracticing = false;
    }

    function startQuiz() {
      currentQuestion = 0;
      score = 0;
      buildQuestions();
      showQuestion();
      showScreen(quizScreen);
      isPracticing = true;
      endPracticeBtn.classList.remove('hidden');
      endPracticeTopBtn.classList.remove('hidden');
      practiceBanner.classList.remove('hidden');
    }

    function updateProfileDisplay() {
      profileNameText.textContent = account.fullName;
      profileEmailText.textContent = account.email;
    }

    function openProfileEdit() {
      profileNameInput.value = account.fullName;
      profileEmailInput.value = account.email;
      profilePasswordInput.value = '';
      profileEditArea.classList.remove('hidden');
    }

    function closeProfileEdit() {
      profileEditArea.classList.add('hidden');
    }

    function saveAccount() {
      if (account) {
        localStorage.setItem('divisionQuizAccount', JSON.stringify(account));
      }
    }

    function loadAccount() {
      try {
        const stored = localStorage.getItem('divisionQuizAccount');
        if (stored) {
          account = JSON.parse(stored);
          playerName = account.fullName;
          welcomeMessage.textContent = `${playerName}, choose a difficulty and start practicing.`;
          updateProfileDisplay();
          updateDifficultyButtons();
          showScreen(homeScreen);
          return true;
        }
      } catch (error) {
        console.warn('Failed to load account from localStorage', error);
      }
      return false;
    }

    function handleAuth() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const fullName = nameInput.value.trim();

      if (!email || !password || (authMode === 'signup' && !fullName)) {
        authMessage.textContent = authMode === 'signup'
          ? 'Please enter your name, email, and password.'
          : 'Please enter both email and password.';
        return;
      }

      if (authMode === 'signup') {
        account = { fullName, email, password };
        saveAccount();
      } else {
        if (!account) {
          if (!loadAccount()) {
            authMessage.textContent = 'No account found. Please sign up first.';
            return;
          }
        }
        if (account.email !== email || account.password !== password) {
          authMessage.textContent = 'Wrong login details or account does not exist.';
          return;
        }
      }

      playerName = account.fullName;
      welcomeMessage.textContent = `${playerName}, choose a difficulty and start practicing.`;
      updateProfileDisplay();
      closeProfileEdit();
      updateDifficultyButtons();
      showScreen(homeScreen);
    }

    authBtn.addEventListener('click', handleAuth);
    showLoginBtn.addEventListener('click', () => updateAuthMode('login'));
    showSignupBtn.addEventListener('click', () => updateAuthMode('signup'));
    editProfileBtn.addEventListener('click', openProfileEdit);
    saveProfileBtn.addEventListener('click', () => {
      const newName = profileNameInput.value.trim();
      const newEmail = profileEmailInput.value.trim();
      const newPassword = profilePasswordInput.value.trim();

      if (!newName || !newEmail) {
        authMessage.textContent = 'Name and email are required to save your profile.';
        return;
      }

      account.fullName = newName;
      account.email = newEmail;
      if (newPassword) {
        account.password = newPassword;
      }
      saveAccount();
      playerName = account.fullName;
      welcomeMessage.textContent = `${playerName}, choose a difficulty and start practicing.`;
      updateProfileDisplay();
      closeProfileEdit();
    });
    cancelProfileBtn.addEventListener('click', () => {
      closeProfileEdit();
    });
    startBtn.addEventListener('click', startQuiz);

    difficultyButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        selectedDifficulty = btn.dataset.difficulty;
        updateDifficultyButtons();
      });
    });

    nextBtn.addEventListener('click', () => {
      showQuestion();
    });
    

    window.addEventListener('beforeunload', (event) => {
      if (isPracticing) {
        event.preventDefault();
        event.returnValue = '';
        return '';
      }
    });

    const confirmModal = document.getElementById('confirm-modal');
    const confirmYes = document.getElementById('confirm-yes');
    const confirmCancel = document.getElementById('confirm-cancel');
    const modalTitle = document.getElementById('modal-title');
    const modalMessage = document.getElementById('modal-message');

    let confirmCallback = null;
    function showConfirmModal(title, message, onConfirm) {
      modalTitle.textContent = title;
      modalMessage.textContent = message;
      confirmCallback = onConfirm;
      confirmModal.classList.remove('hidden');
      confirmModal.setAttribute('aria-hidden', 'false');
      confirmYes.focus();
    }

    function hideConfirmModal() {
      confirmModal.classList.add('hidden');
      confirmModal.setAttribute('aria-hidden', 'true');
      confirmCallback = null;
    }

    confirmYes.addEventListener('click', () => {
      if (typeof confirmCallback === 'function') confirmCallback();
      hideConfirmModal();
    });
    confirmCancel.addEventListener('click', () => hideConfirmModal());

    function endPracticeConfirm() {
      showConfirmModal('End Practice', 'Are you sure you want to end your practice session?', () => {
        isPracticing = false;
        endPracticeBtn.classList.add('hidden');
        endPracticeTopBtn.classList.add('hidden');
        practiceBanner.classList.add('hidden');
        showScreen(homeScreen);
      });
    }

    endPracticeBtn.addEventListener('click', endPracticeConfirm);
    endPracticeTopBtn.addEventListener('click', endPracticeConfirm);

    homeBtn.addEventListener('click', () => {
      showConfirmModal('End Practice', 'Are you sure you want to end your practice session and go back home?', () => {
        isPracticing = false;
        endPracticeBtn.classList.add('hidden');
        endPracticeTopBtn.classList.add('hidden');
        practiceBanner.classList.add('hidden');
        showScreen(homeScreen);
      });
    });

    // Leaderboard / Export / Import
    const leaderboardBtn = document.getElementById('leaderboard-btn');
    const exportBtn = document.getElementById('export-btn');
    const importFileInput = document.getElementById('import-file');
    const leaderboardModal = document.getElementById('leaderboard-modal');
    const leaderboardTableBody = document.querySelector('#leaderboard-table tbody');
    const closeLeaderboardBtn = document.getElementById('close-leaderboard');

    function getLeaderboard() {
      try {
        const raw = localStorage.getItem('divisionQuizLeaderboard');
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        console.warn('Invalid leaderboard in storage', e);
        return [];
      }
    }

    function saveLeaderboard(list) {
      try {
        localStorage.setItem('divisionQuizLeaderboard', JSON.stringify(list));
      } catch (e) {
        console.error('Failed to save leaderboard', e);
      }
    }

    function addToLeaderboard(name, scoreVal, difficulty) {
      const list = getLeaderboard();
      list.push({ name: name || 'Player', score: Number(scoreVal) || 0, difficulty: difficulty || 'easy', date: new Date().toISOString() });
      list.sort((a, b) => b.score - a.score || new Date(b.date) - new Date(a.date));
      saveLeaderboard(list);
    }

    function renderLeaderboard() {
      const list = getLeaderboard();
      leaderboardTableBody.innerHTML = '';
      if (!list.length) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td colspan="4" style="padding:8px;">No results yet.</td>';
        leaderboardTableBody.appendChild(tr);
        return;
      }
      list.forEach(entry => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td style="padding:6px;">${entry.name}</td><td style="padding:6px;">${entry.score}</td><td style="padding:6px;">${entry.difficulty}</td><td style="padding:6px;">${new Date(entry.date).toLocaleString()}</td>`;
        leaderboardTableBody.appendChild(tr);
      });
    }

    function showLeaderboardModal() {
      renderLeaderboard();
      leaderboardModal.classList.remove('hidden');
      leaderboardModal.setAttribute('aria-hidden', 'false');
    }
    function hideLeaderboardModal() {
      leaderboardModal.classList.add('hidden');
      leaderboardModal.setAttribute('aria-hidden', 'true');
    }

    function showSiteMessage(message, type = 'success') {
      if (!siteMessageEl) return;
      siteMessageEl.textContent = message;
      siteMessageEl.className = `status-message ${type === 'error' ? 'status-error' : 'status-success'}`;
      siteMessageEl.classList.remove('hidden');
      setTimeout(() => {
        if (siteMessageEl) siteMessageEl.classList.add('hidden');
      }, 5000);
    }

    function exportData() {
      const payload = { account: null, leaderboard: [] };
      try { payload.account = JSON.parse(localStorage.getItem('divisionQuizAccount') || 'null'); } catch {};
      try { payload.leaderboard = JSON.parse(localStorage.getItem('divisionQuizLeaderboard') || '[]'); } catch {}
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'division-quiz-data.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function handleImportFile(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          showConfirmModal('Import Data', 'Importing will overwrite existing account and leaderboard. Continue?', () => {
            importData(data);
          });
        } catch (err) {
          showSiteMessage('Invalid JSON file.', 'error');
        }
      };
      reader.readAsText(file);
      // reset input so same file can be chosen again
      importFileInput.value = '';
    }

    function importData(obj) {
      if (!obj || typeof obj !== 'object') return;
      if (obj.account) {
        try { localStorage.setItem('divisionQuizAccount', JSON.stringify(obj.account)); account = obj.account; playerName = account.fullName; } catch (e) { console.warn(e); }
      }
      if (Array.isArray(obj.leaderboard)) {
        try { localStorage.setItem('divisionQuizLeaderboard', JSON.stringify(obj.leaderboard)); } catch (e) { console.warn(e); }
      }
      updateProfileDisplay();
      showSiteMessage('Import completed successfully.', 'success');
    }

    if (leaderboardBtn) leaderboardBtn.addEventListener('click', showLeaderboardModal);
    if (exportBtn) exportBtn.addEventListener('click', exportData);
    if (importFileInput) importFileInput.addEventListener('change', handleImportFile);
    if (closeLeaderboardBtn) closeLeaderboardBtn.addEventListener('click', hideLeaderboardModal);
    // clear button removed per user request

    const hasStoredAccount = loadAccount();
    if (!hasStoredAccount) {
      showScreen(loginScreen);
    }
    updateAuthMode('login');
    updateDifficultyButtons();
  </script>
</body>
</html>
